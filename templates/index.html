<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1.0" />
 <title> Assistant</title>
 <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
 <div class="box">
   <h1> Assistant</h1>

   <div class="card">
     <h2>AI Chat</h2>
     <textarea id="question" placeholder=""></textarea>
     <button onclick="askLeo()">Ask</button>

     <h3>Answer</h3>
     <div id="answer"></div>
   </div>

   <div class="card">
     <h2>AI Notes Generator</h2>

     <input id="topic" placeholder="Topic / Chapter Name" />
     <input id="subject" placeholder="Subject e.g. Science" />
     <input id="class_name" placeholder="Class e.g. 10th" />

     <select id="language">
       <option>Hindi</option>
       <option>English</option>
       <option>Hindi + English</option>
     </select>

     <button onclick="generateNotes()">Generate Notes</button>
     <button onclick="downloadPDF()">Download PDF</button>

     <h3>Generated Notes</h3>
     <div id="notes"></div>
   </div>
 </div>

 <script>
   const SCREEN_KEYWORDS = [
     "meri screen par kya hai",
     "screen me kya dikh raha hai",
     "is page ko samjhao",
     "screen",
     "page",
     "tab",
     "window",
     "display",
     "kya dikh raha hai",
     "kya likha hai",
     "ye page",
     "ye screen"
   ];

   let notesContent = "";
   let chatContent = "";

   function shouldUseScreen(question) {
     const q = question.toLowerCase().trim();
     return SCREEN_KEYWORDS.some(keyword => q.includes(keyword));
   }

   async function captureScreenImage() {
     try {
       const stream = await navigator.mediaDevices.getDisplayMedia({ video: true });
       const video = document.createElement("video");
       video.srcObject = stream;

       await video.play();

       const canvas = document.createElement("canvas");
       canvas.width = video.videoWidth || 1280;
       canvas.height = video.videoHeight || 720;

       const ctx = canvas.getContext("2d");
       ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

       stream.getTracks().forEach(track => track.stop());

       return canvas.toDataURL("image/png");
     } catch (error) {
       console.error("Screen capture error:", error);
       return null;
     }
   }

   async function askLeo() {
     const question = document.getElementById("question").value.trim();
     const answerBox = document.getElementById("answer");

     if (!question) {
       answerBox.innerText = "Pehle sawal likho.";
       return;
     }

     // Clear previous content
     answerBox.innerText = "";
     chatContent = "";

     try {
       let image = null;
       const useScreen = shouldUseScreen(question);

       if (useScreen) {
         answerBox.innerText = "Screen capture ho raha hai...";
         image = await captureScreenImage();
         if (!image) {
           answerBox.innerText = "Screen capture failed. Please allow screen sharing.";
           return;
         }
       }

       const res = await fetch("/ask-stream", {
         method: "POST",
         headers: {
           "Content-Type": "application/json"
         },
         body: JSON.stringify({
           question,
           image
         })
       });

       if (!res.ok) {
         const errorData = await res.json();
         answerBox.innerText = "Error: " + (errorData.error || "Unknown error");
         return;
       }

       const reader = res.body.getReader();
       const decoder = new TextDecoder();
       let buffer = "";

       while (true) {
         const { done, value } = await reader.read();
         if (done) break;

         buffer += decoder.decode(value, { stream: true });
         const lines = buffer.split("\n\n");
         buffer = lines.pop() || "";

         for (const line of lines) {
           if (line.startsWith("data: ")) {
             const data = line.slice(6);
             try {
               const parsed = JSON.parse(data);
               if (parsed.error) {
                 answerBox.innerText = "Error: " + parsed.error;
                 return;
               }
               if (parsed.done) {
                 break;
               }
               if (parsed.chunk) {
                 chatContent += parsed.chunk;
                 answerBox.innerText = chatContent;
                 answerBox.scrollTop = answerBox.scrollHeight;
               }
             } catch (e) {
               // Skip invalid JSON
             }
           }
         }
       }
     } catch (error) {
       answerBox.innerText = "Error: " + error.message;
     }
   }

   async function generateNotes() {
     const topic = document.getElementById("topic").value.trim();
     const subject = document.getElementById("subject").value.trim();
     const class_name = document.getElementById("class_name").value.trim();
     const language = document.getElementById("language").value;
     const notesBox = document.getElementById("notes");

     if (!topic) {
       notesBox.innerText = "Pehle topic/chapter name likho.";
       return;
     }

     // Clear previous content
     notesBox.innerText = "";
     notesContent = "";

     try {
       const res = await fetch("/generate-notes-stream", {
         method: "POST",
         headers: {
           "Content-Type": "application/json"
         },
         body: JSON.stringify({
           topic,
           subject,
           class_name,
           language
         })
       });

       if (!res.ok) {
         const errorData = await res.json();
         notesBox.innerText = "Error: " + (errorData.error || "Unknown error");
         return;
       }

       const reader = res.body.getReader();
       const decoder = new TextDecoder();
       let buffer = "";

       while (true) {
         const { done, value } = await reader.read();
         if (done) break;

         buffer += decoder.decode(value, { stream: true });
         const lines = buffer.split("\n\n");
         buffer = lines.pop() || "";

         for (const line of lines) {
           if (line.startsWith("data: ")) {
             const data = line.slice(6);
             try {
               const parsed = JSON.parse(data);
               if (parsed.error) {
                 notesBox.innerText = "Error: " + parsed.error;
                 return;
               }
               if (parsed.done) {
                 break;
               }
               if (parsed.chunk) {
                 notesContent += parsed.chunk;
                 notesBox.innerText = notesContent;
                 notesBox.scrollTop = notesBox.scrollHeight;
               }
             } catch (e) {
               // Skip invalid JSON
             }
           }
         }
       }
     } catch (error) {
       notesBox.innerText = "Error: " + error.message;
     }
   }

   async function downloadPDF() {
     if (!notesContent.trim()) {
       alert("Pehle notes generate karo.");
       return;
     }

     try {
       const res = await fetch("/download-notes-pdf", {
         method: "POST",
         headers: {
           "Content-Type": "application/json"
         },
         body: JSON.stringify({ notes: notesContent })
       });

       if (!res.ok) {
         const errorData = await res.json();
         alert("PDF download error: " + (errorData.error || "Unknown error"));
         return;
       }

       const blob = await res.blob();
       const url = window.URL.createObjectURL(blob);

       const a = document.createElement("a");
       a.href = url;
       a.download = "ai_notes.pdf";
       document.body.appendChild(a);
       a.click();
       a.remove();

       window.URL.revokeObjectURL(url);
     } catch (error) {
       alert("PDF download error: " + error.message);
     }
   }
 </script>
</body>
</html>
